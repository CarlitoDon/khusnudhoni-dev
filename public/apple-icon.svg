<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1115;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e2030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- K left bar -->
  <rect x="42" y="36" width="24" height="120" rx="8" fill="url(#letter)"/>
  <!-- K upper arm -->
  <polygon points="66,96 132,36 156,36 90,96" fill="url(#letter)" opacity="0.95"/>
  <!-- K lower arm -->
  <polygon points="66,96 132,156 156,156 90,96" fill="url(#letter)" opacity="0.95"/>
